<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CHAMPIONS</title>
  <meta name="description" content="Poker night points, champions, money and the bill — all sorted.">
  <meta name="theme-color" content="#0a2418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CHAMPIONS">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- loads in the background so the app never waits for the internet -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-felt">
  <!-- shared SVG gradients -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff4c8"/>
        <stop offset=".5" stop-color="#e8c468"/>
        <stop offset="1" stop-color="#a8791c"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- the poker table under everything: leather rail, felt, betting line, cards and chips -->
  <div class="bg" aria-hidden="true">
    <div class="table"><div class="felt"></div></div>
    <svg class="deco deco-cards" viewBox="0 0 170 140">
      <g transform="rotate(-16 60 80)">
        <rect x="16" y="26" width="72" height="102" rx="9" fill="#fbf7ee" stroke="#d8ccb0" stroke-width="1.5"/>
        <text x="26" y="50" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#141414">A</text>
        <text x="26" y="68" font-family="Georgia, serif" font-size="16" fill="#141414">♠</text>
        <text x="52" y="100" font-family="Georgia, serif" font-size="40" text-anchor="middle" fill="#141414">♠</text>
      </g>
      <g transform="rotate(9 112 76)">
        <rect x="76" y="20" width="72" height="102" rx="9" fill="#fbf7ee" stroke="#d8ccb0" stroke-width="1.5"/>
        <text x="86" y="44" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#c3272b">A</text>
        <text x="86" y="62" font-family="Georgia, serif" font-size="16" fill="#c3272b">♥</text>
        <text x="112" y="94" font-family="Georgia, serif" font-size="40" text-anchor="middle" fill="#c3272b">♥</text>
      </g>
    </svg>
    <svg class="deco deco-chips" viewBox="0 0 150 120">
      <g transform="translate(46 50)">
        <circle r="30" fill="#14141a"/>
        <circle r="25" fill="none" stroke="#f4f1ea" stroke-width="7" stroke-dasharray="9.8 9.8"/>
        <circle r="17" fill="none" stroke="#f4f1ea" stroke-opacity=".55" stroke-width="1.5"/>
      </g>
      <g transform="translate(96 66)">
        <circle r="30" fill="#b3261e"/>
        <circle r="25" fill="none" stroke="#f4f1ea" stroke-width="7" stroke-dasharray="9.8 9.8"/>
        <circle r="17" fill="none" stroke="#f4f1ea" stroke-opacity=".55" stroke-width="1.5"/>
      </g>
      <g transform="translate(70 92)">
        <circle r="26" fill="#1f5fbf"/>
        <circle r="21.5" fill="none" stroke="#f4f1ea" stroke-width="6" stroke-dasharray="8.4 8.5"/>
        <circle r="14.5" fill="none" stroke="#f4f1ea" stroke-opacity=".55" stroke-width="1.5"/>
      </g>
    </svg>
  </div>

  <main id="app" aria-live="polite"></main>
  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <input type="file" id="import-file" accept=".json,application/json" hidden data-change="importFile">

  <noscript>CHAMPIONS needs JavaScript turned on.</noscript>
  <script src="calc.js"></script>
  <script src="sync.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
