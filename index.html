<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CHAMPIONS</title>
  <meta name="description" content="Poker night points, champions, money and the bill — all sorted.">
  <meta name="theme-color" content="#0a3a22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CHAMPIONS">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- loads in the background so the app never waits for the internet -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-felt">
  <!-- shared SVG gradients -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff4b8"/>
        <stop offset=".5" stop-color="#f5c542"/>
        <stop offset="1" stop-color="#b9820f"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="bg" aria-hidden="true">
    <span>♠</span><span>♥</span><span>♦</span><span>♣</span><span>♠</span><span>♥</span><span>♦</span><span>♣</span>
  </div>

  <main id="app" aria-live="polite"></main>
  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <input type="file" id="import-file" accept=".json,application/json" hidden data-change="importFile">

  <noscript>CHAMPIONS needs JavaScript turned on.</noscript>
  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
